<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lite IP Lookup</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font:16px/1.5 system-ui,sans-serif;padding:24px}
main{width:min(100%,700px);text-align:center}
#country{font-size:clamp(3rem,11vw,7rem);line-height:1.05;letter-spacing:-.06em;margin:12px 0 40px;font-weight:800;overflow-wrap:anywhere}
.label{color:#888;text-transform:uppercase;letter-spacing:.15em;font-size:.75rem}
#ip{font-size:clamp(1.2rem,4vw,1.8rem);overflow-wrap:anywhere}
</style>
<main>
<p class="label">Your country</p>
<h1 id="country">Loading...</h1>
<p class="label">Your public IP address</p>
<p id="ip">Checking...</p>
</main>
<script>
fetch('/api/ip')
.then(r=>{if(!r.ok)throw new Error();return r.json()})
.then(d=>{document.getElementById('country').textContent=d.country||'Unknown country';document.getElementById('ip').textContent=d.ip||'IP unavailable'})
.catch(()=>{document.getElementById('country').textContent='Unavailable';document.getElementById('ip').textContent='Could not load IP'})
</script>
