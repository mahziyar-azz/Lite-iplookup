<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>IP</title><style>body{margin:0;min-height:100vh;display:grid;place-content:center;text-align:center;background:#000;color:#fff;font:16px system-ui}h1{font-size:clamp(3rem,12vw,7rem);margin:0 0 1rem;overflow-wrap:anywhere}p{margin:0;overflow-wrap:anywhere}</style><h1 id=c>Loading…</h1><p id=i></p><script>let c=document.querySelector('h1'),i=document.querySelector('p');fetch('https://ipwho.is/?fields=ip,country').then(r=>r.json()).then(d=>{c.textContent=d.country||'?';i.textContent=d.ip||''}).catch(()=>c.textContent='Error')</script>
